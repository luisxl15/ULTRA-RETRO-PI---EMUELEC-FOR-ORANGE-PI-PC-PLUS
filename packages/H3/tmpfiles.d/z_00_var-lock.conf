# /var is a tmpfs, and the systemd 232 built here doesn't install legacy.conf, which is what
# normally creates /var/lock. Without it emuelec_autostart.sh can't create
# /var/lock/start.games, emustation.service's ConditionPathExists fails and
# EmulationStation never starts.
d /run/lock 0755 root root -
L /var/lock - - - - ../run/lock
